name: unit_test
run-name: unit_test-${{ github.event.inputs.ref || github.ref_name || github.ref }}
on:
  pull_request:
    branches:
      - "master"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "autotest/**"
      - ".github/workflows/ete_test_gpu.yaml"
      - ".github/workflows/ete_test_npu.yaml"
      - ".github/workflows/lint.yml"
  # 23:00 Beijing (UTC+8) = 15:00 UTC
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      ref:
        required: false
        description: "Branch, tag, or commit SHA to checkout and test. Default is master."
        type: string
        default: "master"
      changed_files:
        required: false
        description: >-
          Simulated changed files for path-based pytest selection.
          One path per line, or comma-separated.
          Leave empty to run the full non-RL suite.
        type: string
        default: ""
env:
  WORKSPACE_PREFIX: $(echo $GITHUB_WORKSPACE |cut -d '/' -f 1-5)
  WORKSPACE_PREFIX_SHORT: $(echo $GITHUB_WORKSPACE |cut -d '/' -f 1-3)
  IMAGE: ailab-llmrazor/xtuner:pt29_20260520_fb46fea
  KUBEBRAIN_CLUSTER_ENTRY: http://wangyixiuan-cpu.linzhouhan.ailab-llmarchitecture.svc.pjlab.local:11451
  KUBEBRAIN_NAMESPACE: ailab-llmarchitecture

concurrency:
  # PRs cancel by number; nightly cancels overlap on the default branch;
  # manual runs stay isolated via run_id.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'schedule' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      only_rl: ${{ steps.filter.outputs.only_rl }}
      pytest_command: ${{ steps.filter.outputs.pytest_command }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}
      - id: filter
        name: Detect changed paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANGED_FILES: ${{ github.event.inputs.changed_files }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${EVENT_NAME}" = "schedule" ]; then
            echo "Nightly full unit tests"
            echo "only_rl=false" >> "$GITHUB_OUTPUT"
            echo "pytest_command=pytest tests --ignore=tests/rl" >> "$GITHUB_OUTPUT"
            echo "pytest_command=pytest tests --ignore=tests/rl"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            changed_files="$(printf '%s\n' "${INPUT_CHANGED_FILES}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')"
            echo "Manual UT ref=${INPUT_REF}"
            if [ -z "$changed_files" ]; then
              echo "No simulated changed_files; running full non-RL suite"
              echo "only_rl=false" >> "$GITHUB_OUTPUT"
              echo "pytest_command=pytest tests --ignore=tests/rl" >> "$GITHUB_OUTPUT"
              echo "pytest_command=pytest tests --ignore=tests/rl"
              exit 0
            fi
          elif ! changed_files="$(git diff --name-only "${PR_BASE}" "${PR_HEAD}" 2>/dev/null)"; then
            changed_files="$(git diff --name-only HEAD^1 HEAD)"
          fi

          echo "$changed_files"
          pytest_command="$(printf '%s\n' "$changed_files" | python3 ci/scripts/select_unittest_targets.py --github-output "$GITHUB_OUTPUT")" \
            || pytest_command=""
          if [ -z "$pytest_command" ]; then
            echo "Selector failed or empty; falling back to full non-RL suite"
            echo "only_rl=false" >> "$GITHUB_OUTPUT"
            echo "pytest_command=pytest tests --ignore=tests/rl" >> "$GITHUB_OUTPUT"
            pytest_command="pytest tests --ignore=tests/rl"
          fi
          echo "pytest_command=$pytest_command"

  lint:
    runs-on: ubuntu-latest
    needs: detect_changes
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Set up Python 3.12
        uses: actions/setup-python@v2
        with:
          python-version: 3.12
      - name: Install pre-commit hook
        run: |
          pip install pre-commit
          pre-commit install
      - name: Linting
        run: |
          if [ "${{ needs.detect_changes.outputs.only_rl }}" = "true" ]; then
            lint_target="xtuner/v1/rl"
          else
            lint_target="xtuner/v1"
          fi
          pre-commit run --files $(find "$lint_target" -type f)

  unit_test:
    runs-on: [h_cluster]
    needs:
      - detect_changes
      - lint
    steps:
    - name: mask env
      run: |
        echo "::add-mask::${{env.WORKSPACE_PREFIX}}"
        echo "::add-mask::${{env.WORKSPACE_PREFIX_SHORT}}"
        sudo git clean -ffdx
    - uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.ref || github.ref }}

    - id: unit-test
      name: unit-test
      run: |
        export KUBEBRAIN_CLUSTER_ENTRY=http://wangyixiuan-cpu.linzhouhan.ailab-llmarchitecture.svc.pjlab.local:11451
        export KUBEBRAIN_NAMESPACE=ailab-llmarchitecture 
        export PYTHONPYCACHEPREFIX=/tmp
        pytest_command="${{ needs.detect_changes.outputs.pytest_command }}"
        if [ -z "$pytest_command" ]; then
          pytest_command="pytest tests --ignore=tests/rl"
        fi
        echo "pytest_command=$pytest_command"
        source /mnt/shared-storage-user/llmrazor-share/qa-llm-cicd/miniconda3/bin/activate
        conda activate clusterx-ncp
        unset HTTP_PROXY HTTPS_PROXY http_proxy https_proxy
        python ci/scripts/xtuner_unittest.py "$IMAGE_INNER/$IMAGE" "source ${{env.WORKSPACE_PREFIX}}/BASE_ENV.sh;source ci/scripts/CI_ENV.sh" "$pytest_command"
    - name: post
      if: always()
      env:
        RJOB_ID: ${{ steps.unit-test.outputs.rjob_id }}
      run: |
        echo "rjob_id=${RJOB_ID}"
        if [ -n "${RJOB_ID}" ]; then
          export KUBEBRAIN_CLUSTER_ENTRY=http://wangyixiuan-cpu.linzhouhan.ailab-llmarchitecture.svc.pjlab.local:11451
          export KUBEBRAIN_NAMESPACE=ailab-llmarchitecture 
          rjob stop ${RJOB_ID} --namespace=ailab-llmarchitecture
        fi
